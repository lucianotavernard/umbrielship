<header class="border-b border-border">
  <div class="mx-auto flex max-w-7xl items-start justify-between gap-4 px-6 py-8">
    @if (loading()) {
      <div class="grid flex-1 gap-2">
        <t-skeleton class="h-9 w-64" />
        <t-skeleton class="h-4 w-80" />
      </div>
    } @else {
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Clientes</h1>
        <p class="mt-2 text-sm text-muted-foreground">
          Lista de todos os clientes em sua organização.
        </p>
      </div>
      @if (canWrite()) {
        <button tButton type="button" (click)="openSheet()">
          <ng-icon name="lucidePlus" />
          Novo Cliente
        </button>
      }
    }
  </div>
</header>

<section class="mx-auto max-w-7xl px-6 py-8">
  <customer-list-ui [canWrite]="canWrite()" [loading]="loading()" [customers]="customers()" (deleted)="openDialog($event)">
    <t-pagination [page]="page()" [total]="totalCustomers()" (changed)="page.set($event)" />
  </customer-list-ui>
</section>

<t-sheet
  title="Novo cliente"
  class="sm:max-w-md"
  description="Preencha os campos abaixo para criar um novo cliente"
  [isActive]="isSheetActive()"
  (closed)="closeSheet()"
>
  <customer-form-ui
    [loading]="submitting()"
    (closed)="closeSheet()"
    (submitted)="createCustomer($event)"
  />
</t-sheet>

<t-confirmation
  title="Excluir cliente"
  description="Tem certeza que deseja excluir este cliente? Esta ação não pode ser desfeita."
  confirmLabel="Confirmar"
  cancelLabel="Cancelar"
  [isActive]="isDialogActive()"
  [loading]="confirming()"
  (closed)="closeDialog()"
  (confirmed)="deleteCustomer()"
/>
