<div class="border-b border-border">
  <div class="mx-auto max-w-7xl px-6 py-4">
    <a tButton variant="ghost" class="-ml-2 gap-2" routerLink="/customers">
      <ng-icon name="lucideArrowLeft" class="size-4" />
      Voltar para Clientes
    </a>
  </div>
</div>

<div class="mx-auto max-w-7xl px-6 py-8">
  <div class="grid grid-cols-1 items-start gap-6 lg:grid-cols-3 lg:gap-8">
    <div class="grid gap-6 lg:col-span-2">
      <customer-detail-ui [customer]="customer()" (edited)="openEditCustomerSheet()" />

      <section class="rounded-lg border border-border p-6">
        <div class="mb-6 flex items-center justify-between gap-4">
          <div class="grid gap-2">
            <h2 class="text-lg leading-none font-semibold text-foreground">Embarcações</h2>
            <p class="text-sm text-muted-foreground">Embarcações registradas para este cliente.</p>
          </div>

          <div class="shrink-0">
            <button tButton type="button" size="sm" class="gap-2" (click)="openCreateVesselSheet()">
              <ng-icon name="lucidePlus" class="size-4" />
              Nova Embarcação
            </button>
          </div>
        </div>

        <vessel-list-ui [loading]="loading()" [vessels]="vessels()" (deleted)="openDeleteVesselDialog($event)">
          <t-pagination [page]="page()" [total]="totalVessels()" (changed)="page.set($event)" />
        </vessel-list-ui>
      </section>
    </div>

    <!-- Sidebar Column -->
    <div class="grid grid-cols-1 gap-6">
      <section class="rounded-2xl shadow-xs border overflow-hidden">
        <header class="flex items-center gap-3 px-6 py-4 border-b bg-popover">
          <div class="flex p-3 bg-background rounded-lg shadow-xs">
            <ng-icon name="lucideMapPin" class="!size-4" />
          </div>

          <div>
            <h3 class="text-sm font-semibold">Localização & Endereço</h3>
            <p class="text-xs text-muted-foreground">Onde o cliente está localizado?</p>
          </div>
        </header>

        <div class="p-4">
          @if (mapEmbedSrc(); as src) {
            <iframe
              class="block w-full h-72 rounded-xl border-0 bg-muted"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              allowfullscreen
              [title]="'Mapa do endereço do cliente'"
              [src]="src"
            ></iframe>
          } @else {
            <p class="text-sm text-muted-foreground px-1 py-8 text-center">
              Cadastre um endereço no cliente para ver a localização no mapa.
            </p>
          }
        </div>
      </section>
    </div>
  </div>
</div>

<t-sheet
  title="Nova embarcação"
  description="Preencha os campos abaixo para registrar uma embarcação deste cliente"
  class="sm:max-w-md"
  [isActive]="isCreateVesselSheetActive()"
  (closed)="closeCreateVesselSheet()"
>
  <vessel-form-ui [customerId]="id()" (closed)="closeCreateVesselSheet()" (submitted)="createVessel($event)" />
</t-sheet>

<t-sheet
  title="Editar cliente"
  class="sm:max-w-md"
  description="Preencha os campos abaixo para editar as informações do cliente"
  [isActive]="isEditCustomerSheetActive()"
  (closed)="closeEditCustomerSheet()"
>
  <customer-form-ui
    [customer]="customer()"
    (closed)="closeEditCustomerSheet()"
    (submitted)="editCustomer($event)"
  />
</t-sheet>

<t-confirmation
  title="Excluir embarcação"
  description="Tem certeza que deseja excluir esta embarcação? Esta ação não pode ser desfeita."
  confirmLabel="Confirmar"
  cancelLabel="Cancelar"
  [loading]="confirming()"
  [isActive]="isDeleteVesselDialogActive()"
  (closed)="closeDeleteVesselDialog()"
  (confirmed)="deleteVessel()"
/>
