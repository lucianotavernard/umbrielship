<header class="border-b border-border">
  <div class="mx-auto flex max-w-7xl items-start justify-between gap-4 px-6 py-8">
    @if (loading()) {
      <div class="grid flex-1 gap-2">
        <t-skeleton class="h-9 w-64" />
        <t-skeleton class="h-4 w-80" />
      </div>
    } @else {
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Embarcações</h1>
        <p class="mt-2 text-sm text-muted-foreground">
          Lista de todas as embarcações em sua organização.
        </p>
      </div>
      @if (canWrite()) {
        <button tButton type="button" (click)="openSheet()">
          <ng-icon name="lucidePlus" />
          Nova Embarcação
        </button>
      }
    }
  </div>
</header>

<section class="mx-auto max-w-7xl px-6 py-8">
  <vessel-list-ui [canWrite]="canWrite()" [loading]="loading()" [vessels]="vessels()" (deleted)="openDialog($event)">
    <t-pagination [page]="page()" [total]="totalVessels()" (changed)="page.set($event)" />
  </vessel-list-ui>
</section>

<t-sheet
  title="Nova embarcação"
  class="sm:max-w-md"
  description="Preencha os campos abaixo para criar uma nova embarcação"
  [isActive]="isSheetActive()"
  (closed)="closeSheet()"
>
  <vessel-form-ui
    [loading]="submitting()"
    [customers]="customers()"
    (closed)="closeSheet()"
    (submitted)="createVessel($event)"
  />
</t-sheet>

<t-confirmation
  title="Excluir embarcação"
  description="Tem certeza que deseja excluir esta embarcação? Esta ação não pode ser desfeita."
  confirmLabel="Confirmar"
  cancelLabel="Cancelar"
  [isActive]="isDialogActive()"
  [loading]="confirming()"
  (closed)="closeDialog()"
  (confirmed)="deleteVessel()"
/>
