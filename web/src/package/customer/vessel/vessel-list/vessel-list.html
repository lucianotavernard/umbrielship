<div class="mx-auto w-full max-w-[1044px] px-[13px] pt-5 pb-[21px] sm:px-6 sm:pt-[25px] lg:px-[37px] lg:pt-[31px]">
  <div class="mb-[23px] flex flex-col items-start gap-[15px] sm:flex-row sm:items-end sm:justify-between sm:gap-[18px]">
    <div>
      <div class="flex items-center gap-2 text-[9px] font-bold tracking-[1px] text-muted-foreground">
        <span class="h-px w-5 bg-muted-foreground/60"></span>
        OPERAÇÃO / FROTA
      </div>
      <h1 class="mt-[9px] mb-[5px] text-[23px] leading-[1.2] font-normal tracking-[-0.7px] text-foreground sm:text-[25px]">
        Embarcações
      </h1>
      <p class="text-[12px] text-muted-foreground">Gerencie os dados cadastrais da sua frota.</p>
    </div>
    @if (canWrite()) {
      <button
        tButton
        type="button"
        class="h-[37px] gap-2 px-[13px] text-[11px] font-semibold shadow-[0_2px_3px_#087f8c22]"
        (click)="openCreate()"
      >
        <ng-icon name="lucidePlus" class="size-[17px]" />
        Nova embarcação
      </button>
    }
  </div>

  <section aria-label="Resumo da frota" class="mb-[17px] grid grid-cols-2 gap-2 lg:grid-cols-4 lg:gap-[13px]">
    <t-metric label="Total na frota" note="embarcações" tone="blue" [value]="total()">
      <ng-icon name="lucideShip" class="size-[17px]" />
    </t-metric>
  </section>

  <section aria-labelledby="vessel-list-title" class="rounded-lg border border-border bg-card px-[18px] pt-[18px] pb-0">
    <div class="flex flex-col items-start gap-[15px] sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h2 id="vessel-list-title" class="text-[13px] font-normal text-foreground">Lista de embarcações</h2>
        <p class="mt-[5px] text-[10px] text-muted-foreground">Consulte, cadastre e atualize os dados da sua frota.</p>
      </div>
      <button
        type="button"
        class="flex h-[29px] items-center gap-[7px] rounded-[5px] border border-border bg-card px-[9px] text-[10px] text-muted-foreground hover:text-foreground disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="selectedCount() === 0"
        [attr.aria-label]="exportLabel()"
        (click)="exportSelected()"
      >
        <ng-icon name="lucideDownload" class="size-[15px]" />
        Exportar{{ selectedCount() > 0 ? ' (' + selectedCount() + ')' : '' }}
      </button>
    </div>

    <div class="mt-4 flex justify-end">
      <label
        class="flex h-8 w-full items-center gap-2 rounded-[5px] border border-border px-2.5 text-muted-foreground focus-within:border-primary/50 sm:w-[270px]"
      >
        <ng-icon name="lucideSearch" class="size-[15px] shrink-0" />
        <input
          type="search"
          aria-label="Buscar embarcação"
          class="min-w-0 flex-1 border-0 bg-transparent text-[10px] text-foreground outline-none placeholder:text-muted-foreground [&::-webkit-search-cancel-button]:hidden"
          placeholder="Buscar por nome, cliente ou IMO..."
          [value]="search()"
          (input)="search.set($any($event.target).value)"
        />
        @if (search()) {
          <button type="button" aria-label="Limpar busca" class="grid place-items-center" (click)="search.set('')">
            <ng-icon name="lucideX" class="size-[13px]" />
          </button>
        }
      </label>
    </div>

    <vessel-list-ui
      [canWrite]="canWrite()"
      [loading]="loading()"
      [rows]="shown()"
      [selected]="selected()"
      (toggled)="toggle($event)"
      (toggledAll)="toggleShown()"
      (edited)="openEdit($event)"
      (deleted)="openDialog($event)"
    />

    <footer
      data-slot="list-footer"
      class="flex min-h-12 items-center border-t border-border text-[9px] text-muted-foreground"
    >
      @if (loading()) {
        <t-skeleton class="h-3 w-32 rounded" />
      } @else {
        <span>
          Exibindo <strong class="text-foreground/80">{{ shown().length }}</strong> de
          <strong class="text-foreground/80">{{ rows().length }}</strong> embarcações
        </span>
      }
    </footer>
  </section>
</div>

<t-sheet
  kicker="FROTA / EMBARCAÇÕES"
  closeLabel="Fechar formulário"
  class="sm:w-full sm:max-w-[560px]"
  [title]="editing() ? 'Editar embarcação' : 'Nova embarcação'"
  [description]="
    editing()
      ? 'Atualize as informações cadastrais e operacionais desta embarcação.'
      : 'Preencha os dados abaixo para registrar uma embarcação na frota.'
  "
  [flush]="true"
  [isActive]="isSheetActive()"
  (closed)="closeSheet()"
>
  <vessel-form-ui
    [loading]="submitting()"
    [vessel]="editing()"
    [customers]="customers()"
    (closed)="closeSheet()"
    (submitted)="saveVessel($event)"
  />
</t-sheet>

<t-confirmation
  title="Excluir embarcação"
  description="Tem certeza que deseja excluir esta embarcação? Esta ação não pode ser desfeita."
  confirmLabel="Confirmar"
  cancelLabel="Cancelar"
  [isActive]="isDialogActive()"
  [loading]="confirming()"
  (closed)="closeDialog()"
  (confirmed)="deleteVessel()"
/>
