<header class="border-b border-border">
  <div class="mx-auto flex max-w-7xl items-start justify-between gap-4 px-6 py-8">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">Embarcações</h1>
      <p class="mt-2 text-sm text-muted-foreground">Lista de todas as embarcações em sua organização.</p>
    </div>
    <button tButton type="button" (click)="openSheet()">Nova Embarcação</button>
  </div>
</header>

<section class="mx-auto max-w-7xl px-6 py-8">
  <vessel-list-ui [loading]="loading()" [vessels]="vessels()" (deleted)="openDialog($event)">
    <t-pagination [page]="page()" [total]="total()" [perPage]="perPage" (changed)="changePage($event)" />
  </vessel-list-ui>
</section>

<t-sheet
  title="Nova embarcação"
  description="Preencha os campos abaixo para criar uma nova embarcação"
  [isActive]="isSheetActive()"
  (closed)="closeSheet()"
>
  <vessel-form-ui [customers]="customers()" (closed)="closeSheet()" (submitted)="createVessel($event)" />
</t-sheet>

<t-confirmation
  title="Deletar embarcação"
  description="Tem certeza que deseja deletar esta embarcação? Essa ação não pode ser desfeita."
  [isActive]="isDialogActive()"
  [loading]="confirming()"
  (closed)="closeDialog()"
  (confirmed)="confirmDelete()"
/>
