<form class="flex flex-col gap-6 h-[calc(100vh-106px)]" (submit)="handleSubmit($event)">
  <section class="rounded-2xl shadow-xs border overflow-hidden">
    <div class="flex items-center gap-3 px-6 py-4 border-b bg-muted">
      <div class="flex p-3 bg-background rounded-lg shadow-xs">
        <ng-icon name="lucideBuilding2" class="!size-4" />
      </div>
      <div>
        <h3 class="text-sm font-semibold">Detalhes do Cliente</h3>
        <p class="text-xs text-muted-foreground">Informações básicas sobre o cliente</p>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-x-6 gap-y-5 sm:grid-cols-6 p-6">
      <form-group class="sm:col-span-full">
        <label for="name">Nome</label>
        <input type="text" placeholder="Acme Inc" [formField]="customerForm.name" />
      </form-group>

      <form-group class="sm:col-span-full">
        <label for="email">E-mail</label>
        <input type="email" placeholder="acme@example.com" [formField]="customerForm.email" />
      </form-group>
    </div>
  </section>

  <section class="rounded-2xl shadow-xs border overflow-hidden">
    <div class="flex items-center gap-3 px-6 py-4 border-b bg-muted">
      <div class="flex p-3 bg-background rounded-lg shadow-xs">
        <ng-icon name="lucideMapPin" class="!size-4" />
      </div>
      <div>
        <h3 class="text-sm font-semibold">Localização & Endereço</h3>
        <p class="text-xs text-muted-foreground">Onde o cliente está localizado?</p>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-x-6 gap-y-5 sm:grid-cols-6 p-6">
      <form-group class="sm:col-span-full">
        <label for="address">Endereço</label>
        <input
          type="text"
          placeholder="Rua das Flores, 123"
          [formField]="customerForm.address.address"
        />
      </form-group>

      <form-group class="sm:col-span-3">
        <label for="city">Cidade</label>
        <input type="text" placeholder="São Paulo" [formField]="customerForm.address.city" />
      </form-group>
      
      <form-group class="sm:col-span-3">
        <label for="state">Estado</label>
        <input type="text" placeholder="SP" [formField]="customerForm.address.state" />
      </form-group>
    </div>
  </section>

  <footer class="flex items-center justify-end gap-3">
    <button type="button" variant="outline" (click)="close()">Cancelar</button>

    <button type="submit" [disabled]="loading()">
      @if (loading()) {
        <ng-icon name="lucideLoader2" class="!size-4 animate-spin" />
      }
      Salvar
    </button>
  </footer>
</form>
