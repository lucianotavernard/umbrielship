<main class="min-h-screen bg-background">
  <header
    class="sticky top-0 z-50 border-b border-border bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60"
  >
    <div class="mx-auto max-w-7xl px-6 py-4">
      <div class="flex items-center justify-between">
        <nav class="lg:flex items-center gap-2">
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-accent text-accent-foreground"
            variant="ghost"
          >
            Dashboard
          </a>
          <a
            routerLink="/customers"
            routerLinkActive="bg-accent text-accent-foreground"
            variant="ghost"
          >
            Clientes
          </a>
          <a
            routerLink="/vessels"
            routerLinkActive="bg-accent text-accent-foreground"
            variant="ghost"
          >
            Embarcações
          </a>
        </nav>

        <div class="flex items-center gap-2">
          <div class="flex items-center gap-2">
            <button variant="ghost" size="icon-sm" (click)="toggleDarkMode()">
              <ng-icon [name]="isDarkMode() ? 'lucideSun' : 'lucideMoon'" class="!size-4" />
            </button>
          </div>

          <div class="flex items-center gap-2">
            @if (loading()) {
              <div class="grid flex-1 justify-items-end gap-1 text-right text-sm leading-tight">
                <skeleton class="h-4 w-32 rounded" />
                <skeleton class="h-3 w-44 rounded" />
              </div>
              <skeleton class="h-8 w-8 shrink-0 rounded-lg" />
            } @else if (user(); as user) {
              <div class="relative ml-4 flex-shrink-0">
                <div>
                  <avatar class="h-8 w-8 rounded-lg grayscale" (click)="toggleMenu()">
                    <img avatarImage src="https://github.com/shadcn.png" alt="CN" />
                    <avatar-fallback class="rounded-lg">CN</avatar-fallback>
                  </avatar>
                </div>

                @if (isMenuOpen()) {
                  <div
                    animate.enter="animate-fade-in duration-500"
                    animate.leave="animate-fade-out duration-300"
                    class="absolute -right-2 z-20 mt-2 w-40 origin-top-right rounded-md bg-popover p-1 shadow-lg ring-1 ring-black/5 focus:outline-none"
                    role="menu"
                    aria-orientation="vertical"
                    aria-labelledby="user-menu-button"
                    tabindex="-1"
                  >
                    <a
                      class="block"
                      variant="ghost"
                      routerLinkActive="bg-accent text-accent-foreground"
                      role="menuitem"
                      tabindex="-1"
                      (click)="toggleMenu()"
                    >
                      Perfil
                    </a>

                    <a
                      class="block"
                      variant="ghost"
                      routerLinkActive="bg-accent text-accent-foreground"
                      role="menuitem"
                      tabindex="-1"
                      (click)="handleLogout()"
                    >
                      Sair
                    </a>
                  </div>
                }
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </header>

  <router-outlet />
</main>
